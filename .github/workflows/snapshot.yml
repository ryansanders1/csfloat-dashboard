name: CSFloat price snapshot

on:
  schedule:
    - cron: "0 * * * *"   # once an hour, runs on GitHub's servers 24/7
  workflow_dispatch: {}    # lets you trigger a snapshot manually from the Actions tab

permissions:
  contents: write

# ~463 tracked items at CSFloat's polite ~1 req/sec rate takes roughly
# 10-13 minutes per run. This guard makes a new scheduled run WAIT for a
# still-running one instead of overlapping it (two runs hammering CSFloat
# and racing to push at once), in case a run is ever unusually slow.
concurrency:
  group: csfloat-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices and append to price_history.csv
        env:
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
        run: python csfloat_dashboard.py snapshot

      - name: Commit and push if the history file changed
        run: |
          git config user.name "csfloat-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add price_history.csv
          git diff --cached --quiet && exit 0
          git commit -m "snapshot: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase --autostash
          git push
